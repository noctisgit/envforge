name: gpu-image

# Builds deploy/gpu/Dockerfile and pushes it to GHCR as
#   ghcr.io/<owner>/envforge-gpu:<version>  and  :latest
#
# Triggers:
#   - pushing a tag gpu-v<version>, e.g. `git tag gpu-v0.1.0 && git push origin gpu-v0.1.0`
#   - manually (Actions tab -> gpu-image -> Run workflow) with a version
#
# The vLLM base image is ~10 GB compressed and ~30 GB unpacked, more than a stock
# GitHub runner has free (~14 GB), so the first step deletes preinstalled toolchains
# this build doesn't need.

on:
  push:
    tags: ["gpu-v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag, e.g. 0.1.1 (without the gpu-v prefix)"
        required: true
      latest:
        description: "Also move the :latest tag"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write # push to ghcr.io with the workflow's GITHUB_TOKEN

concurrency:
  group: gpu-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h /

      - name: Put Docker's storage on the larger disk
        run: |
          # Standard Linux runners also have a big temporary disk on /mnt. If it has
          # more room than /, point the Docker daemon (and so buildx) at it.
          root_free=$(df --output=avail -k / | tail -1)
          mnt_free=$(df --output=avail -k /mnt 2>/dev/null | tail -1 || echo 0)
          if [ "${mnt_free:-0}" -gt "$root_free" ]; then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker
            conf=/etc/docker/daemon.json
            { [ -f "$conf" ] && sudo cat "$conf" || echo '{}'; } \
              | jq '. + {"data-root": "/mnt/docker"}' | sudo tee "$conf.new" >/dev/null
            sudo mv "$conf.new" "$conf"
            sudo systemctl start docker
          fi
          docker info --format 'docker data root: {{.DockerRootDir}}'
          df -h / /mnt || true

      - uses: actions/checkout@v4

      - name: Work out image name and tags
        id: meta
        env:
          OWNER: ${{ github.repository_owner }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          # GHCR repository names must be lowercase.
          image="ghcr.io/${OWNER,,}/envforge-gpu"
          if [[ "$GITHUB_REF" == refs/tags/gpu-v* ]]; then
            version="${GITHUB_REF#refs/tags/gpu-v}"
            latest=true
          else
            version="${INPUT_VERSION#gpu-v}"
            latest="${INPUT_LATEST:-true}"
          fi
          if ! [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]{0,127}$ ]]; then
            echo "invalid version: '$version'" >&2
            exit 1
          fi
          tags="$image:$version"
          if [ "$latest" = "true" ]; then tags="$tags,$image:latest"; fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"
          echo "will push: $tags"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/gpu/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ENVFORGE_GPU_VERSION=${{ steps.meta.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          # Only envforge's own layers are cached (the base image is pulled each time).
          cache-from: type=gha,scope=envforge-gpu
          cache-to: type=gha,scope=envforge-gpu,mode=max

      - name: Summary
        run: |
          {
            echo "### envforge GPU image pushed"
            echo
            echo "\`${{ steps.meta.outputs.tags }}\`"
            echo
            echo "RunPod/Vast image: \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
