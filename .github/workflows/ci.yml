name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --extra dev --extra web
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - name: reference solutions pass across 150 seeds
        run: uv run envforge run netops --model scripted --episodes 150 --runs-dir /tmp/runs | tail -12

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env: { NEXT_PUBLIC_AUTH_PROVIDER: local, NEXT_TELEMETRY_DISABLED: 1 }
