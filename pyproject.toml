[project]
name = "envforge"
version = "0.1.0"
description = "Pluggable RL environments + eval-to-training pipeline for LLM agents. Any domain, one loop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nicholas Lau" }]
keywords = ["reinforcement-learning", "llm-agents", "rl-environments", "evaluation", "fine-tuning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
  "openai>=1.50",
  "docker>=7.2.0",
]

[project.optional-dependencies]
# Phase 3+: training on the GPU box. Not installed by default on the control plane.
train = [
  "torch>=2.4",
  "transformers>=4.45",
  "trl>=0.12",
  "peft>=0.13",
  "datasets>=3.0",
  "accelerate>=1.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
web = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "scikit-learn>=1.5",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]
privacy = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]
# Tier-2 PII detection (envforge/builder/pii_model.py): a local GLiNER span model on CPU.
# torch comes from PyTorch's CPU-only index (see [tool.uv.sources]) — ~200 MB instead of
# the ~2.5 GB CUDA build. The model weights (~1 GB) are downloaded on first use into
# $HF_HOME, never baked into an image.
pii = [
    "gliner>=0.2.20",
    "protobuf>=4.25",  # transformers needs it to read the mDeBERTa sentencepiece tokenizer
    "torch>=2.4",
]

# CPU-only PyTorch wheels. `explicit = true` means only packages pinned to this index in
# [tool.uv.sources] (torch) come from it; everything else still comes from PyPI. This
# also applies to the `train` extra in uv.lock — fine, because the GPU box installs its
# training stack from deploy/gpu/requirements-train.txt on top of the vLLM image's CUDA
# torch, not from uv.lock.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project.scripts]
envforge = "envforge.cli:app"
envforge-api = "envforge.web.app:main"
envforge-worker = "envforge.web.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["envforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: typer uses Option() in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
