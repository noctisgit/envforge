[project]
name = "envforge"
version = "0.1.0"
description = "Pluggable RL environments + eval-to-training pipeline for LLM agents. Any domain, one loop."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Nicholas Lau" }]
keywords = ["reinforcement-learning", "llm-agents", "rl-environments", "evaluation", "fine-tuning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
  "openai>=1.50",
]

[project.optional-dependencies]
# Phase 3+: training on the GPU box. Not installed by default on the control plane.
train = [
  "torch>=2.4",
  "transformers>=4.45",
  "trl>=0.12",
  "peft>=0.13",
  "datasets>=3.0",
  "accelerate>=1.0",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
web = [
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "email-validator>=2.2",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
envforge = "envforge.cli:app"
envforge-api = "envforge.web.app:main"
envforge-worker = "envforge.web.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["envforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: typer uses Option() in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
